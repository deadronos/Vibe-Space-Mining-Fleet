name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
      # The Unity build is made locally (Actions has no Unity license) and committed to
      # web/public/unity; fail early if it or its signed clean manifest (#94) is missing or stale.
      - name: Unity build and manifest
        run: node scripts/verify-unity-manifest.mjs --require-clean
      - run: pnpm run build
