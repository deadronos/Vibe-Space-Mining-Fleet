name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      # The Unity build is made locally (Actions has no Unity license) and committed to
      # web/public/unity; fail early if it is missing.
      - name: Unity build present
        run: test -f web/public/unity/Build/unity.loader.js && test -f web/public/unity/Build/unity.wasm.unityweb
      - run: pnpm run build
